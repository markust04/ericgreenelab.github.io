sherry-patrick:
  name:        Patrick Sherry (he/him)
  bio:         1st year M.S. student in Chemistry (conc in Biochemistry)
  fullbio:     "Patrick is a first-year graduate student pursuing his M.S. in chemistry with an emphasis in biochemistry, and received his undergraduate degree in biochemistry from CSU Chico. He is part of the team ‘opposite enzymes’, studying transhydrogenase systems as a solution to balance NADPH and NADH concentrations.


In his free time, Patrick enjoys going on hikes, exploring the city, traveling, and spending time with friends.

  "
  avatar:      /assets/images/sherry.png
  member:      true
  current:     true

tecson-markus:
  name:        Markus Tecson (he/him)
  bio:         2nd year M.S. Student in Chemistry (conc in Biochemistry)
  fullbio:     "Markus is interested in using a combination of biochemical, biophysical, and computational techniques to explore how changes to a conserved interface in Human Glutamine Synthetase impacts oligomerization and activity. This enzyme plays a key role in both cancer and neurodegenerative diseases, making the discoveries especially exciting for future therapies. In addition to being an SF State Scholar, Markus is a joint NIH Bridges to Doctorates Fellow and Genentech Foundation MS Scholar.


     Outside of the lab, Markus loves to spend time with his cat and play video games. He is also an avid photographer, runner, and pretends to know how to play piano!
     
     
     "
  avatar:      /assets/images/Tecson.jpg
  member:      true
  current:     true

