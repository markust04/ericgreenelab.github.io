greene-eric:
  name:        Eric Greene (he/him)
  bio:         Assistant Professor
  
               Department Chemistry and Biochemistry
  fullbio:     "Eric graduated from the University of Colorado, Boulder with degrees in Biochemistry and Molecular, Cellular, and Development Biology. As an undergraduate, he worked with Dr. Zhongping Tan using chemical biology approaches to study glycosylated proteins.


    As a graduate student in [Dr. Andy Martin’s](http://mcb.berkeley.edu/labs/martin/) lab at UC Berkeley, Eric studied how conformations and conformational dynamics of the 26S proteasome influence degradation processes. He also collaborated with [Dr. Susan Marqusee’s](https://zebra.berkeley.edu) lab to help illuminate how energetic changes conferred by site-specific ubiquitination on substrate proteins influenced whether, and how, these proteins were degraded by the proteasome.


    Eric was a postdoc in [James Fraser's](https://fraserlab.com) lab at UCSF, where he worked on project seeking to understand how protein conformations impact function and regulation, and, how posttranslational factors that occur throughout a protein’s lifetime further tune function."
  avatar:      /assets/images/greene-eric.jpg
  member:      true
  current:     true
  email:       egreene@sfsu.edu
  bluesky:     egreene.bsky.social

abdallah-danya:
  name:        Danya Abdallah (she/her)
  bio:         3rd year B.S. Biochemistry Student
  fullbio:     "As a member of the Greene Lab, Danya studies how metabolic enzymes are regulated through protein–protein interactions. Her project focuses on investigating whether argininosuccinate synthetase 1 (ASS1) and argininosuccinate lyase (ASL) form a functional metabolon by expressing, purifying, and testing their combined activity. This work aims to improve our understanding of the regulation of the urea cycle and arginine metabolism.


Outside the lab, Danya enjoys spending time with friends, going on walks, and skiing when she needs a break from school.

  "
  avatar:      /assets/images/abdallah.jpg
  member:      true
  current:     true

ahmad-jeanan:
  name:        Jeanan Ahmad
  bio:         Graduate Student
  fullbio:     "Jeanan is currently working on 'Team Argininosuccinate Synthetase (ASS1)' with the goal of understanding the binding of ASS1 to NMRAL1 and seeing how it impacts theh structure and activity of ASS1.


  Jeanan loves to go to the beach with her friends and currently serves as a president of a club on campus. Outside of thhe lab, Jeanan loves watching shows and catching up on sleep.

  "
  avatar:      /assets/images/ahmad.jpg
  member:      true
  current:     true

alkabbani-haneen:
  name:        Haneen Alkabbani (she/her)
  bio:         3rd year B.S. Biochemistry Student
  fullbio:     "Haneen Alkabbani is a junior pursuing a Bachelor of Science in Biochemistry at San Francisco State University. As a dedicated member of 'Team Opposite Enzymes' she contributes  research project aimed at exploring how enzymes are regulated. She is a Genentech Foundation and CSU-SPA (formerly LSAMP) scholar.


     Outside the lab and classroom, she enjoys exploring San Francisco with friends, often discovering new coffee shops around the city."
  avatar:      /assets/images/Alkabbani.jpg
  member:      true
  current:     true

bautista-andrew:
  name:        Andrew Bautista (he/him)
  bio:         2nd year M.S. Student in Chemistry (conc in Biochemistry)
  fullbio:     "Andrew is pursuing his Master's degree in Biochemistry studying the mechanism behind posttranslational modification dependent inhibition of bacterial glutamine synthetase. Andrew received a B.S. with summa cum laude honors in Biochemistry from SF State in 2024 and, after excelling at protein biochemistry in his coursework, opted to pursue a graduate degree in the Greene lab. "
  avatar:      /assets/images/Bautista.jpg
  member:      true
  current:     true

