geluz-cyrina:
  name:        Cyrina Geluz (she/her)
  bio:         Graduate Student
  fullbio:     "Cyrina is pursuing a B.S. in Biochemistry at San Francisco State University and is one of the first members of the once nascent Greene lab. She is an expert in protein visualization and biochemistry, having worked on several projects including bioinformatics focused on exploring human glutamine synthetase. Currently, she is working on investigating a conserved oligomeric interface in human glutamine synthetase and the impact of disease variants at this interface.


  Outside of the lab, Cyrina enjoys exploring the Bay Area and shopping for pens!"
  avatar:      /assets/images/Geluz.jpg
  member:      true
  current:     true

gurung-lucky:
  name:        Lucky Gurung (she/her)
  bio:         3rd year B.S. Biochemistry Student
  fullbio:     "Lucky is a junior pursuing a degree in Biochemistry. As a member of the Greene lab she works on Argininosuccinate Synthetase 1 (ASS1), a pivotal enzyme in the urea cycle and arginine biosynthesis. She is specifically investigating the consequences of post-translational modifications (PTMs) to ASS1 utilizing kinetic analyses with hopes of studying structural effects through cryo-EM.


  Outside of the lab, she enjoys painting, reading, and hiking. Lucky made it a whooping 4050 meters (~13,287 feet) above sea level!
  
  "
  avatar:      /assets/images/gurung.jpg
  member:      true
  current:     true

hernandez-emily:
  name:        Emily Hernandez (she/her)
  bio:         2nd year M.S. Student in Chemistry (conc in Biochemistry)
  fullbio:     "Emily is a First Gen Latina, and second year Master's Student. Emily received her Bachelor's of Science in Biochemistry with a minor in Race and Resistance at San Francisco State University. During her undergraduate career she completed biochemistry research with Dr. Greene in the Greene lab.
  
  
  Continuing her work with him as a graduate student, she is studying Tau protein amyloid conformations in diseases by inducing fibril formation with chemicals like sodium alginate and analyzing their structures using Cryo-EM. Emily is also part of SEO as an NIH-Bridge MS Scholar and Secretary of the Chemistry and Biochemistry Student Association here on campus. Outside of school she loves to travel. Her most recent trip was a solo trip to Japan!
  "
  avatar:      /assets/images/Hernandez.jpg
  member:      true
  current:     true

